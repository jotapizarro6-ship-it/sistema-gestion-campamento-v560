name: Validar Secciones Avanzadas Temporal

on:
  push:
    branches: ["dev-plan-gerencia-historico-20260828"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript
        run: |
          node --check assets/app-4.js
          node --check assets/advanced-sections.js
          node --check assets/advanced-sections-echarts.js
          node --check assets/echarts-loader.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Validar estructura avanzada
        run: |
          test -f assets/advanced-sections.css
          grep -q "Capacidad y demanda proyectada" assets/advanced-sections.js
          grep -q "Estado operacional" assets/advanced-sections.js
          grep -q "Evolución histórica" assets/advanced-sections.js
          grep -q "advPlanCapacity" assets/advanced-sections-echarts.js
          grep -q "advMgmtGauge" assets/advanced-sections-echarts.js
          grep -q "advHistTrend" assets/advanced-sections-echarts.js
          grep -q "advanced-sections-echarts.js" assets/echarts-loader.js
