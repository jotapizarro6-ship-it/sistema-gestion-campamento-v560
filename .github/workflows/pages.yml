name: Publicar Sistema Campamento

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fijar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar sintaxis JavaScript crítica
        run: |
          cat assets/app-1.js assets/app-2a.js assets/app-2b.js assets/app-3a.js assets/app-3b.js assets/app-4.js assets/final-audit-fixes.js > /tmp/campamento-app.js
          node --check /tmp/campamento-app.js
          node --check assets/semantic-model-runtime.js
          node --check assets/high-volume-runtime.js
          node --check assets/echarts-loader.js
      - name: Guardas de arquitectura y secretos
        run: node tests/architecture-security-smoke.mjs
      - name: Pruebas funcionales críticas
        run: |
          node tests/functional-smoke.mjs
          node tests/operations-suite-smoke.mjs
          node tests/integrity-executive-smoke.mjs
      - name: Certificación de escala 2000x2000
        run: node tests/high-volume-performance-smoke.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
