name: Validar Sistema Campamento

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript combinado
        run: |
          cat assets/app-1.js assets/app-2a.js assets/app-2b.js assets/app-3a.js assets/app-3b.js assets/app-4.js assets/final-audit-fixes.js > /tmp/campamento-app.js
          node --check /tmp/campamento-app.js
          node --check assets/app-4-core.js
          node --check assets/audit-fixes.js
          node --check assets/final-audit-fixes.js
          node --check assets/responsive-admin.js
          node --check assets/bi-dashboard.js
          node --check assets/echarts-loader.js
          node --check assets/echarts-dashboard.js
          node --check assets/public-date.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Validar estructura web
        run: |
          test -f index.html
          test -f admin.html
          test -f assets/styles.css
          test -f assets/public-assignment.css
          test -f assets/public-date.js
          test -f assets/final-audit-fixes.js
          test -f assets/bi-dashboard.js
          test -f assets/bi-dashboard.css
          test -f assets/echarts-loader.js
          test -f assets/echarts-dashboard.js
          test -f assets/echarts-dashboard.css
          grep -q "CONSULTA DE ASIGNACIÓN" index.html
          grep -q "VER MI ASIGNACIÓN" index.html
          grep -q "Centro de Gestión" admin.html
          grep -q "Dashboard gerencial" admin.html
          grep -q "Cargar Excel" admin.html
          grep -q "Calidad de Base" assets/bi-dashboard.js
          grep -q "Heatmap de capacidad" assets/bi-dashboard.js
          grep -q "Subidas / Bajadas / Neto" assets/bi-dashboard.js
          grep -q "6.1.0" assets/echarts-loader.js
          grep -q "Distribución por turno" assets/echarts-dashboard.js
          grep -q "Evolución de ocupación" assets/echarts-dashboard.js
