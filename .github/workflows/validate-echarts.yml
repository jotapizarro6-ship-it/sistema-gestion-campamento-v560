name: Validar ECharts Dashboard

on:
  push:
    branches: ["echarts-dashboard-v2"]

permissions:
  contents: read

jobs:
  validate-echarts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript
        run: |
          node --check assets/app-4.js
          node --check assets/echarts-loader.js
          node --check assets/echarts-dashboard.js
          node --check assets/bi-dashboard.js
      - name: Pruebas funcionales existentes
        run: node tests/functional-smoke.mjs
      - name: Validar integración ECharts
        run: |
          test -f assets/echarts-dashboard.css
          grep -q "6.1.0" assets/echarts-loader.js
          grep -q "ecModuleChart" assets/echarts-dashboard.js
          grep -q "ecCapacityChart" assets/echarts-dashboard.js
          grep -q "ecMovementChart" assets/echarts-dashboard.js
          grep -q "Distribución por turno" assets/echarts-dashboard.js
          grep -q "Evolución de ocupación" assets/echarts-dashboard.js
          grep -q "echarts-loader.js" assets/app-4.js
