<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f2d4a">
  <title>Consulta de alojamiento · Campamento</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="public-page">
  <header class="topbar public-topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">Sistema de Gestión de Campamento</div>
        <div class="subtitle">Consulta de alojamiento · acceso trabajador</div>
      </div>
    </div>
  </header>
  <main class="public-wrap">
    <section class="panel public-card">
      <div class="eyebrow">Asignación vigente</div>
      <h1>Consulta tu alojamiento</h1>
      <p class="muted">Ingresa tu RUT para ver únicamente tu módulo, habitación, cama y turno actual.</p>
      <form id="workerLookupForm" class="stack gap-lg">
        <label class="field">
          <span>RUT</span>
          <input id="workerRut" name="rut" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="12.345.678-9" required>
        </label>
        <button class="btn btn-primary btn-lg" type="submit">Consultar asignación</button>
      </form>
      <div id="workerLookupResult" class="result-zone" aria-live="polite"></div>
      <p class="footnote">La información corresponde a la última asignación cargada por Administración de Campamento.</p>
    </section>
  </main>
  <script src="assets/app-1.js"></script>
  <script src="assets/app-2a.js"></script>
  <script src="assets/app-2b.js"></script>
  <script src="assets/app-3a.js"></script>
  <script src="assets/app-3b.js"></script>
  <script src="assets/app-4.js"></script>
</body>
</html>
