name: Validar observabilidad GARPI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fijar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validar runtime JavaScript
        run: node --check assets/garpi-observability.js

      - name: Validar contrato de observabilidad
        run: node tests/observability-contract-smoke.mjs

      - name: Validar aislamiento de producción
        shell: bash
        run: |
          PROD_REF="usrst""cxiluvsizoxwlxj"

          if grep -R --line-number --fixed-string \
            "$PROD_REF" \
            assets/garpi-observability.js \
            observability.json \
            tests/observability-contract-smoke.mjs; then
            echo "Production project ref leaked into observability implementation"
            exit 1
          fi

          echo "Observability production isolation: PASS"