name: Validar Dashboard Gerencial Temporal

on:
  push:
    branches: ["dev-ajuste-dashboard-gerencial-20260828"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript
        run: |
          node --check assets/advanced-sections-echarts.js
          node --check assets/advanced-sections.js
          node --check assets/app-4.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Validar mejoras gerenciales
        run: |
          grep -q "RESUMEN EJECUTIVO" assets/advanced-sections.css
          grep -q "adv-gauge-legend" assets/advanced-sections.css
          grep -q "installGaugeHelp" assets/advanced-sections-echarts.js
          grep -q "SOBRECUPO" assets/advanced-sections-echarts.js
          grep -q "80/maxGauge" assets/advanced-sections-echarts.js
