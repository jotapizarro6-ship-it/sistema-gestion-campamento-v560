<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f2d4a">
  <title>Administración · Sistema de Gestión de Campamento</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="admin-page">
  <div id="adminLoginScreen" class="login-screen">
    <section class="panel login-card">
      <div class="eyebrow">Jefatura / Gerencia</div>
      <h1>Acceso administración</h1>
      <p class="muted">Ingresa la contraseña administrativa. La credencial no se almacena en esta página.</p>
      <form id="adminLoginForm" class="stack gap-lg">
        <label class="field"><span>Contraseña</span><input id="adminPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-lg" type="submit">Ingresar</button>
      </form>
      <div id="adminLoginMessage" class="result-zone" aria-live="polite"></div>
      <a class="link-back" href="./">← Ir a consulta de trabajadores</a>
    </section>
  </div>

  <div id="adminApp" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand">Gestión Campamento</div>
        <div class="subtitle">Cloud v5.6.0 · Jefatura / Gerencia</div>
      </div>
      <nav class="nav-list" id="adminNav">
        <button data-view="overview" class="nav-btn active">Resumen operativo</button>
        <button data-view="control" class="nav-btn">Centro de Gestión</button>
        <button data-view="planning" class="nav-btn">Planificación 30 días</button>
        <button data-view="management" class="nav-btn">Dashboard gerencial</button>
        <button data-view="history" class="nav-btn">Histórico / Cierre</button>
        <button data-view="movements" class="nav-btn">Movimientos</button>
        <button data-view="reservations" class="nav-btn">Reservas</button>
        <button data-view="blocks" class="nav-btn">Bloqueos de camas</button>
        <button data-view="workers" class="nav-btn">Trabajadores</button>
        <button data-view="consults" class="nav-btn">Consultas RUT</button>
        <button data-view="excel" class="nav-btn">Cargar Excel</button>
        <button data-view="exports" class="nav-btn">Reportes / Respaldo</button>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary full">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar admin-topbar">
        <div class="topbar-inner topbar-admin">
          <button id="menuBtn" class="icon-btn mobile-only" aria-label="Abrir menú">☰</button>
          <div>
            <div id="pageTitle" class="brand">Resumen operativo</div>
            <div id="systemMeta" class="subtitle">Base central Supabase · cargando…</div>
          </div>
          <div class="top-actions">
            <span id="syncBadge" class="status-pill">Sincronizando</span>
            <button id="refreshAllBtn" class="btn btn-secondary">Actualizar</button>
          </div>
        </div>
      </header>

      <main class="content">
        <div id="globalMessage" class="global-message hidden" aria-live="polite"></div>
        <section id="view-overview" class="view active"></section>
        <section id="view-control" class="view"></section>
        <section id="view-planning" class="view"></section>
        <section id="view-management" class="view"></section>
        <section id="view-history" class="view"></section>
        <section id="view-movements" class="view"></section>
        <section id="view-reservations" class="view"></section>
        <section id="view-blocks" class="view"></section>
        <section id="view-workers" class="view"></section>
        <section id="view-consults" class="view"></section>
        <section id="view-excel" class="view"></section>
        <section id="view-exports" class="view"></section>
      </main>
    </div>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-head"><h3 id="detailTitle">Detalle</h3><button id="detailClose" class="icon-btn" aria-label="Cerrar">×</button></div>
    <div id="detailBody" class="dialog-body"></div>
  </dialog>

  <script src="assets/app-1.js"></script>
  <script src="assets/app-2a.js"></script>
  <script src="assets/app-2b.js"></script>
  <script src="assets/app-3a.js"></script>
  <script src="assets/app-3b.js"></script>
  <script src="assets/app-4.js"></script>
  <script>
    (()=>{
      const fold=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim().replace(/\s+/g,' ');
      const rutCompact=v=>String(v??'').toUpperCase().replace(/[^0-9K]/g,'');
      const workerMatches=(worker,query)=>{
        const raw=String(query??'').trim();
        if(!raw)return false;
        const rq=rutCompact(raw);
        if(rq.length>=4&&rutCompact(worker.rut).includes(rq))return true;
        const tokens=fold(raw).split(' ').filter(Boolean);
        const haystack=fold([worker.nombre,worker.rut,worker.empresa,worker.turno,worker.modulo,worker.habitacion,worker.cama,worker.especialidad,worker.categoria,worker.sexo].join(' '));
        return tokens.length>0&&tokens.every(token=>haystack.includes(token));
      };
      const workerDetail=worker=>{
        const assigned=clean(worker.modulo)&&clean(worker.habitacion)&&clean(worker.cama);
        const value=v=>esc(clean(v)||'No informado');
        return `<section class="panel mb"><div class="section-head"><div><div class="eyebrow">TRABAJADOR ENCONTRADO</div><h2>${value(worker.nombre)}</h2><div class="muted">RUT ${value(worker.rut)}</div></div><span class="badge ${assigned?'green':'amber'}">${assigned?'Asignación vigente':'Asignación incompleta'}</span></div><section class="kpis"><div class="kpi"><span>🏢 MÓDULO</span><strong>${value(worker.modulo)}</strong><small>Pabellón / piso</small></div><div class="kpi accent"><span>🚪 HABITACIÓN</span><strong>${value(worker.habitacion)}</strong><small>Habitación asignada</small></div><div class="kpi"><span>🛏️ CAMA</span><strong>${value(worker.cama)}</strong><small>Cama asignada</small></div></section><div class="mt">${table([worker],[{label:'RUT',key:'rut'},{label:'Trabajador',key:'nombre'},{label:'Empresa',key:'empresa'},{label:'Turno',key:'turno'},{label:'Especialidad',key:'especialidad'},{label:'Categoría',key:'categoria'},{label:'Sexo',key:'sexo'}],{limit:1})}</div></section>`;
      };
      renderWorkers=function(){
        const d=A.data;
        $('#view-workers').innerHTML=`<div class="section-head"><div><h2>Trabajadores y asignaciones</h2><div class="muted">Consulta la asignación vigente cargada desde la planilla Excel base.</div></div></div><section class="panel mb"><div class="toolbar"><label class="field"><span>Buscar trabajador</span><input id="workerSearch" autocomplete="off" placeholder="Ingresa RUT, nombre o apellido"></label><button id="workerSearchBtn" class="btn btn-primary" type="button">Buscar</button></div><p class="muted">Puedes escribir el RUT con o sin puntos y guion. También puedes buscar por nombre completo o por uno o más apellidos.</p></section><div id="workerSearchResults"><div class="notice info">Ingresa un RUT, nombre o apellido para visualizar la asignación del trabajador.</div></div>`;
        const input=$('#workerSearch'),results=$('#workerSearchResults');
        const render=query=>{
          const q=String(query??'').trim();
          if(!q){results.innerHTML='<div class="notice info">Ingresa un RUT, nombre o apellido para visualizar la asignación del trabajador.</div>';return}
          const rows=d.workers.filter(w=>workerMatches(w,q)).sort((a,b)=>clean(a.nombre).localeCompare(clean(b.nombre),'es'));
          if(!rows.length){results.innerHTML=`<div class="notice error">No se encontraron trabajadores para <strong>${esc(q)}</strong>. Revisa el RUT, nombre o apellido ingresado.</div>`;return}
          if(rows.length===1){results.innerHTML=workerDetail(rows[0]);return}
          results.innerHTML=`<div class="notice info mb">Se encontraron ${rows.length} coincidencias. Revisa la asignación en la tabla o selecciona <strong>Ver detalle</strong>.</div>${table(rows,[{label:'RUT',key:'rut'},{label:'Trabajador',key:'nombre'},{label:'Empresa',key:'empresa'},{label:'Turno',key:'turno'},{label:'Módulo',key:'modulo'},{label:'Hab.',key:'habitacion'},{label:'Cama',key:'cama'},{label:'Especialidad',key:'especialidad'},{label:'Categoría',key:'categoria'},{label:'Acción',render:w=>`<button class="btn btn-secondary small-btn" type="button" data-worker-rut="${esc(w.rut)}">Ver detalle</button>`}],{limit:1000})}`;
          $$('[data-worker-rut]',results).forEach(button=>button.addEventListener('click',()=>{
            const worker=rows.find(w=>clean(w.rut)===clean(button.dataset.workerRut));
            if(worker){results.innerHTML=workerDetail(worker);results.scrollIntoView({behavior:'smooth',block:'start'})}
          }));
        };
        $('#workerSearchBtn').addEventListener('click',()=>render(input.value));
        input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();render(input.value)}});
        input.addEventListener('input',()=>{if(input.value.trim().length>=3)render(input.value);else if(!input.value.trim())render('')});
      };
    })();

    document.addEventListener('submit',async e=>{
      const form=e.target;
      if(!(form instanceof HTMLFormElement)||form.id!=='excelForm')return;
      e.preventDefault();
      e.stopImmediatePropagation();
      const file=form.querySelector('#excelFile')?.files?.[0];
      if(!file)return;
      try{
        showMessage('Cargando y validando Excel…','info');
        const r=await webApi('upload_excel',{method:'POST',file,token:A.token});
        form.reset();
        await loadAll();
        showMessage(`Excel cargado correctamente${r.data?.workers?`: ${r.data.workers} trabajadores · ${r.data.beds} camas`:''}.`);
      }catch(err){
        showMessage(err.message||'No se pudo cargar la planilla Excel.','error');
      }
    },true);
  </script>
</body>
</html>
