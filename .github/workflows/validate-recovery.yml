name: Validar Recuperación Segura

on:
  push:
    branches: ["main", "dev-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fijar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar contrato de recuperación
        run: node tests/recovery-backend-smoke.mjs
