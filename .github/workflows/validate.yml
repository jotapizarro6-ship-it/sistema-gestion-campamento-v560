name: Validar Sistema Campamento

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript combinado
        run: |
          cat assets/app-1.js assets/app-2a.js assets/app-2b.js assets/app-3a.js assets/app-3b.js assets/app-4.js assets/final-audit-fixes.js > /tmp/campamento-app.js
          node --check /tmp/campamento-app.js
          node --check assets/app-4-core.js
          node --check assets/audit-fixes.js
          node --check assets/final-audit-fixes.js
          node --check assets/responsive-admin.js
          node --check assets/bi-dashboard.js
          node --check assets/control-center.js
          node --check assets/advanced-sections.js
          node --check assets/persistent-errors.js
          node --check assets/echarts-loader.js
          node --check assets/echarts-dashboard.js
          node --check assets/control-center-echarts.js
          node --check assets/advanced-sections-echarts.js
          node --check assets/advanced-gauge-fix.js
          node --check assets/public-date.js
          node --check assets/public-worker-v2.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Validar estructura web
        run: |
          test -f index.html
          test -f admin.html
          test -f assets/styles.css
          test -f assets/public-assignment.css
          test -f assets/public-assignment-emphasis.css
          test -f assets/public-worker-v2.css
          test -f assets/public-worker-v2.js
          test -f assets/public-date.js
          test -f assets/final-audit-fixes.js
          test -f assets/bi-dashboard.js
          test -f assets/bi-dashboard.css
          test -f assets/control-center.js
          test -f assets/control-center.css
          test -f assets/advanced-sections.js
          test -f assets/advanced-sections.css
          test -f assets/persistent-errors.js
          test -f assets/echarts-loader.js
          test -f assets/echarts-dashboard.js
          test -f assets/echarts-dashboard.css
          test -f assets/control-center-echarts.js
          test -f assets/advanced-sections-echarts.js
          test -f assets/advanced-gauge-fix.js
          grep -q "CONSULTA DE ASIGNACIÓN" index.html
          grep -q "VER MI ASIGNACIÓN" index.html
          grep -q "Consulta rápida de alojamiento" index.html
          grep -q "public-worker-v2.css" index.html
          grep -q "public-worker-v2.js" index.html
          grep -q "COPIAR ASIGNACIÓN" assets/public-worker-v2.js
          grep -q "NUEVA CONSULTA" assets/public-worker-v2.js
          grep -q "CONSULTANDO" assets/public-worker-v2.js
          grep -q "Centro de Gestión" admin.html
          grep -q "Dashboard gerencial" admin.html
          grep -q "Cargar Excel" admin.html
          grep -q "Calidad de Base" assets/bi-dashboard.js
          grep -q "Heatmap de capacidad" assets/bi-dashboard.js
          grep -q "Subidas / Bajadas / Neto" assets/bi-dashboard.js
          grep -q "Estado y composición del módulo" assets/control-center.js
          grep -q "Presión de capacidad por módulo" assets/control-center.js
          grep -q "Excepciones del módulo" assets/control-center.js
          grep -q "Capacidad y demanda proyectada" assets/advanced-sections.js
          grep -q "Estado operacional" assets/advanced-sections.js
          grep -q "Evolución histórica" assets/advanced-sections.js
          grep -q "RESUMEN EJECUTIVO" assets/advanced-sections.css
          grep -q "adv-gauge-legend" assets/advanced-sections.css
          grep -q "installGaugeHelp" assets/advanced-sections-echarts.js
          grep -q "6.1.0" assets/echarts-loader.js
          grep -q "Distribución por turno" assets/echarts-dashboard.js
          grep -q "Evolución de ocupación" assets/echarts-dashboard.js
          grep -q "control-center-echarts.js" assets/echarts-loader.js
          grep -q "advanced-sections-echarts.js" assets/echarts-loader.js
          grep -q "advanced-gauge-fix.js" assets/echarts-loader.js
