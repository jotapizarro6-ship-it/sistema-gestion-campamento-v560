name: Validar Rendimiento Alto Volumen

on:
  push:
    branches: ["main", "dev-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-volume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  high-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fijar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar capas de rendimiento
        run: |
          node --check assets/semantic-model-runtime.js
          node --check assets/high-volume-runtime.js
          node --check assets/high-volume-post-inline.js
          node --check assets/admin-performance-guard.js
          node --check assets/echarts-loader.js
          node --check assets/app-4.js
          test -f assets/semantic-model-runtime.js
          test -f assets/high-volume-runtime.js
          test -f assets/high-volume-post-inline.js
          test -f assets/admin-performance-guard.js
          test -f tests/high-volume-performance-smoke.mjs
          test -f tests/admin-performance-guard-smoke.mjs
          grep -q "semantic-model-runtime.js" assets/app-4.js
          grep -q "high-volume-runtime.js" assets/app-4.js
          grep -q "high-volume-post-inline.js" assets/app-4.js
          grep -q "admin-performance-guard.js" assets/app-4.js
          grep -q "CampSemanticModel" assets/semantic-model-runtime.js
          grep -q "CampAdminPerformance" assets/admin-performance-guard.js
          grep -q "CampEChartsLazy" assets/echarts-loader.js
          grep -q "forceFunctionRegion" assets/high-volume-runtime.js
      - name: Guardia de estabilidad del administrador
        run: node tests/admin-performance-guard-smoke.mjs
      - name: Prueba sintética 2000 trabajadores y 2000 camas
        run: node tests/high-volume-performance-smoke.mjs
