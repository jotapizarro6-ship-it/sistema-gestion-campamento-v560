name: Validar Arquitectura BI Alto Volumen

on:
  push:
    branches: ["dev-arquitectura-bi-alto-volumen-20260829"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar sintaxis JavaScript completa
        run: |
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Pruebas funcionales existentes
        run: |
          node tests/functional-smoke.mjs
          node tests/operations-suite-smoke.mjs
          node tests/integrity-executive-smoke.mjs
      - name: Prueba de alto volumen y modelo semántico
        run: node tests/high-volume-performance-smoke.mjs
      - name: Validar estructura y contratos principales
        run: |
          test -f index.html
          test -f admin.html
          test -f assets/semantic-model-runtime.js
          test -f assets/high-volume-runtime.js
          test -f assets/high-volume-post-inline.js
          test -f assets/echarts-loader.js
          grep -q "semantic-model-runtime.js" assets/app-4.js
          grep -q "high-volume-runtime.js" assets/app-4.js
          grep -q "high-volume-post-inline.js" assets/app-4.js
          grep -q "CampSemanticModel" assets/semantic-model-runtime.js
          grep -q "CampEChartsLazy" assets/echarts-loader.js
          grep -q "CONSULTA DE ASIGNACIÓN" index.html
          grep -q "public-worker-v2.js" index.html
          grep -q "Centro de Gestión" admin.html
          grep -q "Dashboard gerencial" admin.html
          grep -q "Cargar Excel" admin.html
          grep -q "Centro de Control" assets/operations-shell.js
          grep -q "What-if" assets/planning-suite.js
          grep -q "Plan Maestro Operacional" assets/planning-suite.js
          grep -q "Semáforo General del Campamento" assets/integrity-executive.js
