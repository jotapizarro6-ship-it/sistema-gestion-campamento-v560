name: Validación temporal botón Consultas RUT

on:
  push:
    branches: ["dev-fix-boton-consultas-rut-20260829"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar sintaxis
        run: |
          node --check assets/consults-export-xlsx.js
          node --check assets/app-4.js
      - name: Probar exportador
        run: node tests/consults-export-smoke.mjs
      - name: Pruebas funcionales existentes
        run: |
          node tests/functional-smoke.mjs
          node tests/operations-suite-smoke.mjs
      - name: Verificar corrección de integración
        run: |
          grep -q "MutationObserver" assets/consults-export-xlsx.js
          grep -q "typeof A" assets/consults-export-xlsx.js
          grep -q "consultsExportActions" assets/consults-export-xlsx.js
          grep -q "20260829-consults2" assets/app-4.js
          grep -q "Descargar Excel (.xlsx)" assets/consults-export-xlsx.js
