name: Certificar 2000 trabajadores y 2000 camas

on:
  push:
    branches: ["dev-certificacion-2000x2000-20260829"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar sintaxis completa del sistema y gráficos
        run: |
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/high-volume-performance-smoke.mjs
          test -f assets/echarts-dashboard.js
          test -f assets/control-center-echarts.js
          test -f assets/advanced-sections-echarts.js
          test -f assets/operations-suite-echarts.js
          test -f assets/advanced-gauge-fix.js
          grep -q "setOption" assets/echarts-dashboard.js
          grep -q "setOption" assets/control-center-echarts.js
          grep -q "setOption" assets/advanced-sections-echarts.js
          grep -q "setOption" assets/operations-suite-echarts.js
      - name: Validar reglas funcionales existentes
        run: |
          node tests/functional-smoke.mjs
          node tests/operations-suite-smoke.mjs
          node tests/integrity-executive-smoke.mjs
      - name: Certificar escenario sintético 2000x2000
        run: node tests/high-volume-performance-smoke.mjs
      - name: Verificar contratos de dashboards
        run: |
          grep -q "Ocupación física por módulo" assets/echarts-dashboard.js
          grep -q "Heatmap de capacidad" assets/echarts-dashboard.js
          grep -q "Subidas / Bajadas / Neto" assets/echarts-dashboard.js
          grep -q "Distribución por turno" assets/echarts-dashboard.js
          grep -q "Evolución de ocupación" assets/echarts-dashboard.js
          grep -q "Capacidad y demanda proyectada" assets/advanced-sections.js
          grep -q "Estado operacional" assets/advanced-sections.js
          grep -q "Evolución histórica" assets/advanced-sections.js
          grep -q "Presión de capacidad por módulo" assets/control-center.js
          grep -q "What-if" assets/planning-suite.js
          grep -q "Semáforo General del Campamento" assets/integrity-executive.js
