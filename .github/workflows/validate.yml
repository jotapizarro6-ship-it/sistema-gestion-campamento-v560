name: Validar Sistema Campamento

on:
  push:
    branches: ["main", "dev-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fijar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar JavaScript combinado
        run: |
          cat assets/app-1.js assets/app-2a.js assets/app-2b.js assets/app-3a.js assets/app-3b.js assets/app-4.js assets/final-audit-fixes.js > /tmp/campamento-app.js
          node --check /tmp/campamento-app.js
          node --check assets/app-4-core.js
          node --check assets/audit-fixes.js
          node --check assets/final-audit-fixes.js
          node --check assets/responsive-admin.js
          node --check assets/bi-dashboard.js
          node --check assets/control-center.js
          node --check assets/advanced-sections.js
          node --check assets/persistent-errors.js
          node --check assets/operations-shell.js
          node --check assets/operations-core.js
          node --check assets/command-center.js
          node --check assets/planning-suite.js
          node --check assets/whatif-clarity.js
          node --check assets/governance.js
          node --check assets/integrity-executive.js
          node --check assets/admin-performance-guard.js
          node --check assets/consults-export-xlsx.js
          node --check assets/workforce-mod-moi.js
          node --check assets/echarts-loader.js
          node --check assets/echarts-dashboard.js
          node --check assets/control-center-echarts.js
          node --check assets/advanced-sections-echarts.js
          node --check assets/advanced-gauge-fix.js
          node --check assets/operations-suite-echarts.js
          node --check assets/public-date.js
          node --check assets/public-worker-v2.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Pruebas Centro de Control y What-if
        run: node tests/operations-suite-smoke.mjs
      - name: Pruebas Integridad y Semáforo
        run: node tests/integrity-executive-smoke.mjs
      - name: Prueba de estabilidad administrativa
        run: node tests/admin-performance-guard-smoke.mjs
      - name: Prueba navegación Trabajadores a Consultas RUT
        run: node tests/consults-navigation-freeze-smoke.mjs
      - name: Prueba dotación MOD MOI 2000 trabajadores
        run: node tests/workforce-mod-moi-smoke.mjs
      - name: Validar R3 Schema Foundations
        run: |
          node tests/r3-schema-foundations.baseline-runner.cjs
          node tests/r3-schema-foundations.green-runner.cjs
      - name: Validar estructura web
        run: |
          test -f index.html
          test -f admin.html
          test -f assets/styles.css
          test -f assets/public-assignment.css
          test -f assets/public-assignment-emphasis.css
          test -f assets/public-worker-v2.css
          test -f assets/public-worker-v2.js
          test -f assets/public-date.js
          test -f assets/final-audit-fixes.js
          test -f assets/bi-dashboard.js
          test -f assets/bi-dashboard.css
          test -f assets/control-center.js
          test -f assets/control-center.css
          test -f assets/advanced-sections.js
          test -f assets/advanced-sections.css
          test -f assets/persistent-errors.js
          test -f assets/operations-shell.js
          test -f assets/operations-core.js
          test -f assets/command-center.js
          test -f assets/planning-suite.js
          test -f assets/whatif-clarity.js
          test -f assets/whatif-clarity.css
          test -f assets/governance.js
          test -f assets/operations-suite.css
          test -f assets/integrity-executive.js
          test -f assets/integrity-executive.css
          test -f assets/admin-performance-guard.js
          test -f assets/consults-export-xlsx.js
          test -f assets/workforce-mod-moi.js
          test -f assets/workforce-mod-moi.css
          test -f assets/echarts-loader.js
          test -f assets/echarts-dashboard.js
          test -f assets/echarts-dashboard.css
          test -f assets/control-center-echarts.js
          test -f assets/advanced-sections-echarts.js
          test -f assets/advanced-gauge-fix.js
          test -f assets/operations-suite-echarts.js
          test -f tests/operations-suite-smoke.mjs
          test -f tests/integrity-executive-smoke.mjs
          test -f tests/admin-performance-guard-smoke.mjs
          test -f tests/consults-navigation-freeze-smoke.mjs
          test -f tests/workforce-mod-moi-smoke.mjs
          grep -q "CONSULTA DE ASIGNACIÓN" index.html
          grep -q "VER MI ASIGNACIÓN" index.html
          grep -q "Consulta rápida de alojamiento" index.html
          grep -q "public-worker-v2.css" index.html
          grep -q "public-worker-v2.js" index.html
          grep -q "COPIAR ASIGNACIÓN" assets/public-worker-v2.js
          grep -q "NUEVA CONSULTA" assets/public-worker-v2.js
          grep -q "CONSULTANDO" assets/public-worker-v2.js
          ! grep -q "summary.className='public-location-path'" assets/public-worker-v2.js
          grep -q "Centro de Gestión" admin.html
          grep -q "Dashboard gerencial" admin.html
          grep -q "Cargar Excel" admin.html
          grep -q "Centro de Control" assets/operations-shell.js
          grep -q "Seguridad / Trazabilidad" assets/operations-shell.js
          grep -q "Centro de Alertas y Acciones Operacionales" assets/command-center.js
          grep -q "What-if" assets/planning-suite.js
          grep -q "Plan Maestro Operacional" assets/planning-suite.js
          grep -q "Variación de camas-día" assets/whatif-clarity.js
          grep -q "Capacidad diaria" assets/whatif-clarity.js
          grep -q "Capacidad total ventana" assets/whatif-clarity.js
          grep -q "No son 300 camas físicas" assets/whatif-clarity.js
          grep -q "whatif-clarity.js" assets/app-4.js
          grep -q "whatif-clarity.css" assets/app-4.js
          grep -q "Resiliencia, Trazabilidad y Perfiles" assets/governance.js
          grep -q "Semáforo General del Campamento" assets/integrity-executive.js
          grep -q "Centro de Integridad de Datos" assets/integrity-executive.js
          grep -q "Salud del respaldo y recuperación" assets/integrity-executive.js
          grep -q "Informe Ejecutivo Automático" assets/integrity-executive.js
          grep -q "campamento-recovery-api" assets/integrity-executive.js
          grep -q "integrity-executive.js" assets/app-4.js
          grep -q "integrity-executive.css" assets/app-4.js
          grep -q "admin-performance-guard.js" assets/app-4.js
          grep -q "CampAdminPerformance" assets/admin-performance-guard.js
          grep -q "campamento-control-api" assets/operations-core.js
          grep -q "operations-suite-echarts.js" assets/echarts-loader.js
          grep -q "Calidad de Base" assets/bi-dashboard.js
          grep -q "Heatmap de capacidad" assets/bi-dashboard.js
          grep -q "Subidas / Bajadas / Neto" assets/bi-dashboard.js
          grep -q "Estado y composición del módulo" assets/control-center.js
          grep -q "Presión de capacidad por módulo" assets/control-center.js
          grep -q "Excepciones del módulo" assets/control-center.js
          grep -q "Capacidad y demanda proyectada" assets/advanced-sections.js
          grep -q "Estado operacional" assets/advanced-sections.js
          grep -q "Evolución histórica" assets/advanced-sections.js
          grep -q "RESUMEN EJECUTIVO" assets/advanced-sections.css
          grep -q "adv-gauge-legend" assets/advanced-sections.css
          grep -q "installGaugeHelp" assets/advanced-sections-echarts.js
          grep -q "6.1.0" assets/echarts-loader.js
          grep -q "Distribución por turno" assets/echarts-dashboard.js
          grep -q "Evolución de ocupación" assets/echarts-dashboard.js
          grep -q "control-center-echarts.js" assets/echarts-loader.js
          grep -q "advanced-sections-echarts.js" assets/echarts-loader.js
          grep -q "advanced-gauge-fix.js" assets/echarts-loader.js
          grep -q "Mano de Obra Directa / Indirecta" assets/workforce-mod-moi.js
          grep -q "workforce-mod-moi.js" assets/app-4.js
          grep -q "workforce-mod-moi.css" assets/app-4.js
