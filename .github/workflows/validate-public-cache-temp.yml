name: Validar Corrección Caché Consulta

on:
  push:
    branches: ["dev-cache-fix-consulta-20260828"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript
        run: node --check assets/public-worker-v2.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Validar cache bust y defensa visual
        run: |
          test -f assets/public-worker-no-duplicate.css
          grep -q "public-worker-v2.js?v=20260828-3" index.html
          grep -q "public-worker-v2.css?v=20260828-3" index.html
          grep -q "public-worker-no-duplicate.css" index.html
          grep -q "public-location-path{display:none!important;}" assets/public-worker-no-duplicate.css
          ! grep -q "summary.className='public-location-path'" assets/public-worker-v2.js
