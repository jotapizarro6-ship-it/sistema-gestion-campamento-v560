name: Validar Claridad What-if

on:
  push:
    branches: ["dev-claridad-camas-dia-whatif-20260828"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar JavaScript
        run: |
          node --check assets/whatif-clarity.js
          node --check assets/app-4.js
      - name: Pruebas funcionales v5.6.0
        run: node tests/functional-smoke.mjs
      - name: Pruebas What-if
        run: node tests/operations-suite-smoke.mjs
      - name: Validar claridad visual
        run: |
          test -f assets/whatif-clarity.css
          grep -q "Variación de camas-día" assets/whatif-clarity.js
          grep -q "Capacidad diaria" assets/whatif-clarity.js
          grep -q "Capacidad total ventana" assets/whatif-clarity.js
          grep -q "No son 300 camas físicas" assets/whatif-clarity.js
          grep -q "whatif-clarity.js" assets/app-4.js
          grep -q "whatif-clarity.css" assets/app-4.js
