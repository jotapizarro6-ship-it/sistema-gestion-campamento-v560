name: Validación temporal exportación Consultas RUT

on:
  push:
    branches: ["dev-export-consultas-rut-excel-20260829"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar sintaxis
        run: |
          node --check assets/consults-export-xlsx.js
          node --check assets/app-4.js
      - name: Prueba exportador Consultas RUT
        run: node tests/consults-export-smoke.mjs
      - name: Pruebas funcionales existentes
        run: node tests/functional-smoke.mjs
      - name: Pruebas What-if existentes
        run: node tests/operations-suite-smoke.mjs
      - name: Validar integración
        run: |
          grep -q "Descargar Excel (.xlsx)" assets/consults-export-xlsx.js
          grep -q "!autofilter" assets/consults-export-xlsx.js
          grep -q "consults-export-xlsx.js" assets/app-4.js
